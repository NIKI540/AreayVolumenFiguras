<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Àrea y Perimetro de 3 figuras geometricas</title>
</head>
<body>
    <h3>Àrea y Perimetro de figuras</h3>
    <script>
         // Área del triangulo
            alert("A continuaciòn se pedira los valores del area del triangulo");
               let base = parseFloat(prompt("Introduce la base del triángulo " ));
               let altura = parseFloat(prompt("Introduce la altura del triángulo "));
               let area = (base * altura) / 2;


            //Perimetro de triangulo

            alert("A continuaciòn se pediran los valores del perimetro del triangulo");
            let lado = parseFloat(prompt("Introduce el valor de sus lados"));
            let perimetro = lado * lado ;

            //Resultado
            alert("El àrea del triangulo es:" + area);
            console.log("El area del triangulo es:",area);
            alert("El perimetro del triangulo es:" + perimetro);
            console.log("El perimetro del triangulo es:", perimetro);
    </script>
</body>
</html>
