<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Àrea y Perimetro de 3 figuras geometricas</title>
</head>
<body>
    <h3>Àrea y Perimetro de figuras</h3>
    <script>
         // Área del Cirulo
         
            alert("A continuaciòn se pedira los valores del area del circulo");
               let radio = parseFloat(prompt("Introduce el valor del radio" ));
               let area = Math.PI * (radio * radio);


            //Perimetro de Circulo

            alert("A continuaciòn se pediran los valores del perimetro del circulo");
            let Radio = parseFloat(prompt("Introduce el valor de su radio"));
            let perimetro = 2 *(Math.PI * Radio);

            //Resultado
            alert("El àrea del circulo es:" + area);
            console.log("El area del circulo es:",area);
            alert("El perimetro del circulo es:" + perimetro);
            console.log("El perimetro del circulo es:", perimetro);
    </script>
</body>
