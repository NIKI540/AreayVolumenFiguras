<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Àrea y Perimetro de 3 figuras geometricas</title>
</head>
<body>
    <h3>Àrea y Perimetro de figuras</h3>
    <script>
         // Área del Paralelogramo
         
            alert("A continuaciòn se pedira los valores del area del paralelogramo");
               let base = parseFloat(prompt("Introduce la base del paralegramo " ));
               let altura = parseFloat(prompt("Introduce la altura del paralelogramo "));
               let area =(base * altura);


            //Perimetro de Paralelogramo

           
            let perimetro = 2 * (base * altura); ;

            //Resultado
            alert("El àrea del paralelogramo es:" + area);
            console.log("El area del paralelogramo es:",area);
            alert("El perimetro del paralelogramo es:" + perimetro);
            console.log("El perimetro del paralelogramo es:", perimetro);
    </script>
</body>
</html>
